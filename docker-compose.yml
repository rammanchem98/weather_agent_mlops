services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent
    ports:
      - "8080:8080"
    environment:
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      - qdrant

